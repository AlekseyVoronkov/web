<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="switzerland screen.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&display=swap" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Talking Travel</title>
    </head>

    <header class="header">
        <div class="logo-container">
            <img src="img/logo.svg" alt="logo" class="logo">
            <div class="nav-items">
                <span class="nav-text">Home</span>
                <span class="nav-text">Story</span>
                <span class="nav-text">Gallery</span>
                <span class="nav-text">Contact Us</span>
                <img src="img/search.svg" alt="search" class="search">
                <img src="img/profile.svg" alt="profile" class="profile">
            </div>
        </div>
    </header>

    <section class="blog-section">
        <div class="blog-article-hero">
            <div class="blog-article-hero-header">
                <div class="blog-article-hero-header-title">
                    <h1 class="section-theme">POPULAR DESTINATIONS</h1>
                    <h2 class="section-title">Hello Switzerland!</h2>
                </div>

                <div class="blog-article-hero-header-author">
                    <img src="img/author.png" alt="author image" class="blog-article-hero-header-author-image">
                    <p class="text">Darrell Steward</p>
                    <p class="subtext">Author / Photographer</p>
                </div>
            </div>
        </div>
    </section>

    <section class="bottom-thingy">
        <p class="bottom-thingy-copyright">© 2022, Talking Travel. All Rights Reserved.</p>
        <p class="bottom-thingy-home">Home</p>
        <p class="bottom-thingy-blog">Blog</p>
        <p class="bottom-thingy-gallery">Gallery</p>
        <p class="bottom-thingy-contact">Contact Us</p>
    </section>
</html>
